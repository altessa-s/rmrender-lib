# Native Windows C23 build of the shared software backend.
name: Windows Cairo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    name: windows (${{ matrix.arch }}, shared ${{ matrix.shared }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: ['x64', 'arm64']
        shared: ['OFF', 'ON']
        # Per-architecture runner, MSYS2 environment and package prefix; the
        # PDFium platform is win-<arch>.
        include:
          - arch: x64
            runner: windows-2022
            msystem: CLANG64
            pkg: mingw-w64-clang-x86_64
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg: mingw-w64-clang-aarch64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: >-
            ${{ matrix.pkg }}-clang
            ${{ matrix.pkg }}-cmake
            ${{ matrix.pkg }}-ninja
            ${{ matrix.pkg }}-pkgconf
            ${{ matrix.pkg }}-python
            ${{ matrix.pkg }}-cairo
            ${{ matrix.pkg }}-pango
            ${{ matrix.pkg }}-fontconfig
            ${{ matrix.pkg }}-harfbuzz
            ${{ matrix.pkg }}-gdk-pixbuf2
            ${{ matrix.pkg }}-zlib
            ${{ matrix.pkg }}-poppler
            ${{ matrix.pkg }}-libxml2
            ${{ matrix.pkg }}-ntldd
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: altessa-s/rmlines-lib
          ref: 14ea47353d4881aefd4987ab332765cd06609296 # v1.1.0
          path: .deps/rmlines
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: altessa-s/rmdoc-lib
          ref: aea7ed1670e2aa34ee0281d00eedc372b80b3f7c # v1.1.0
          path: .deps/rmdoc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: altessa-s/rmmarks-lib
          ref: 565f2dfe0d2e31a218c4a874bdba96417d1ddc83 # v1.1.0
          path: .deps/rmmarks
      - name: Build dependencies
        run: |
          for name in rmlines rmdoc rmmarks
          do
            upper=$(echo "$name" | tr '[:lower:]' '[:upper:]')
            cmake -S ".deps/$name" -B "build-$name" -G Ninja -DCMAKE_C_COMPILER=clang -DBUILD_SHARED_LIBS=OFF -D"${upper}_BUILD_TESTS"=OFF -D"${upper}_BUILD_TOOLS"=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.deps/install"
            cmake --build "build-$name" --target install -j4
          done
      - run: python scripts/fetch-pdfium.py --platform win-${{ matrix.arch }} --output .deps/pdfium
      - name: Configure and test
        run: |
          export PATH="$PWD/.deps/pdfium/bin:$PWD/build:$PATH"
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DRMRENDER_BUILD_APPLE=OFF -DRMRENDER_BUILD_CAIRO=ON -DRMRENDER_BUILD_RMLINES=ON -DRMRENDER_BUILD_RMDOC=ON -DRMRENDER_BUILD_RMMARKS=ON -DRMRENDER_WERROR=ON -DRMRENDER_REQUIRE_PDFIUM_ACTUALTEXT=ON -DPDFium_ROOT="$GITHUB_WORKSPACE/.deps/pdfium" -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps/install"
          cmake --build build --target all -j4
          # Font files must not pile up: none in the temporary directories, and
          # the shared cache must not grow when the same fonts load again.
          temporary() {
            find "$(cygpath -u "$TMP")" "$(cygpath -u "$TEMP")" -maxdepth 1 -name 'rmrender-font-*' 2>/dev/null | sort -u | wc -l
          }
          cache="$(cygpath -u "$LOCALAPPDATA")/rmrender/fonts"
          cached() {
            find "$cache" -type f 2>/dev/null | wc -l
          }
          before=$(temporary)
          cmake --build build --target check -j4
          first=$(cached)
          ctest --test-dir build --output-on-failure
          second=$(cached)
          after=$(temporary)
          echo "temporary font files: $before before, $after after; cached fonts: $first, then $second"
          test "$after" -le "$before"
          test "$first" -gt 0
          test "$second" -eq "$first"
          cmake --install build --prefix "$GITHUB_WORKSPACE/.deps/install"
      - name: Test with non-ASCII temporary and cache directories
        run: |
          export PATH="$PWD/.deps/pdfium/bin:$PWD/build:$PATH"
          # On the system volume, where Windows creates the 8.3 aliases the
          # font cache falls back to for a non-ASCII directory.
          root="$(cygpath -u "$LOCALAPPDATA")/rmrender-ci"
          mkdir -p "$root/Временные" "$root/Данные"
          cmd //c "fsutil 8dot3name query C:"
          TMP="$(cygpath -w "$root/Временные")"
          TEMP="$TMP"
          XDG_DATA_HOME="$(cygpath -w "$root/Данные")"
          export TMP TEMP XDG_DATA_HOME
          ctest --test-dir build --output-on-failure
          test "$(find "$root/Данные/rmrender/fonts" -name '*.ttf' | wc -l)" -gt 0
          test "$(find "$root/Временные" -maxdepth 1 -name 'rmrender-font-*' | wc -l)" -eq 0
      - name: Fonts with only the DLLs shipped
        run: |
          # An application that ships just the DLLs has no etc/fonts beside
          # Fontconfig's DLL, so Fontconfig finds no default fonts.conf; font
          # map creation must still leave stderr empty.
          export PATH="$PWD/.deps/pdfium/bin:$PWD/build:$PATH"
          app="$RUNNER_TEMP/shipped"
          rm -rf "$app"
          mkdir -p "$app"
          cp build/test_fontconfig_default.exe "$app/"
          # ntldd reads the import tables natively on both architectures; the
          # MSYS ldd runs x64-emulated on ARM64 and traces the program through
          # the debug API instead. Keep resolved DLLs outside the Windows tree.
          ntldd -R build/test_fontconfig_default.exe | tr -d '\r' | awk '$2 == "=>" && $3 ~ /^[A-Za-z]:\\/ && tolower($3) !~ /^[a-z]:\\windows\\/ {print $3}' | sort -u | cygpath -u -f - > "$RUNNER_TEMP/shipped.dlls"
          cat "$RUNNER_TEMP/shipped.dlls"
          xargs -a "$RUNNER_TEMP/shipped.dlls" cp -t "$app/"
          test -f "$app/libfontconfig-1.dll"
          fonts="$(cygpath -w "$PWD/resources/fonts")"
          PATH="$app:/c/Windows/System32:/c/Windows" "$app/test_fontconfig_default.exe" "$fonts" 2> "$RUNNER_TEMP/shipped.stderr"
          cat "$RUNNER_TEMP/shipped.stderr"
          test ! -s "$RUNNER_TEMP/shipped.stderr"
      - name: Installed SDK consumer
        run: |
          export PATH="$PWD/.deps/pdfium/bin:$PWD/.deps/install/bin:$PATH"
          cmake -S tests/installed_consumer -B build-consumer -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.deps/install" -DPDFium_ROOT="$GITHUB_WORKSPACE/.deps/pdfium"
          cmake --build build-consumer -j4
          build-consumer/consumer.exe
      - name: Record toolchain and render sample
        run: |
          export PATH="$PWD/.deps/pdfium/bin:$PWD/build:$PATH"
          mkdir -p artifacts
          pacman -Q > artifacts/packages.txt
          clang --version > artifacts/compiler.txt
          build/test_linux_emoji.exe resources/fonts artifacts/windows-${{ matrix.arch }}.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-cairo-${{ matrix.arch }}-${{ matrix.shared }}
          path: |
            artifacts/
            build/Testing/Temporary/LastTest.log
